# Local development services.
#
# Phase 0 adds the api, web and caddy services here. For now this provides
# the two databases — one that survives restarts, one thrown away by the
# integration suite — and Garage for object storage.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18 keeps its data in a versioned subdirectory, so the mount
      # goes at /var/lib/postgresql — not /var/lib/postgresql/data as in <=17.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app}']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_test
    ports:
      - '${POSTGRES_TEST_PORT:-5433}:5432'
    # Ephemeral on purpose: the integration suite recreates schema on every
    # run, and losing this data costs nothing.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app']
      interval: 5s
      timeout: 5s
      retries: 10

  # Garage, not MinIO: MinIO's community edition was archived in April 2026 and
  # publishes no images any more. Garage is the S3 store the code talks to, and
  # nothing in the code knows its name — see StorageService.
  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    ports:
      # Host side only: inside the network Garage keeps its own 3900/3903.
      - '${S3_PORT:-4900}:3900'
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      # Metadata and data on separate volumes, both apart from the database's.
      # Files cannot be recovered from a database backup, so the two are backed
      # up separately and must be restorable separately.
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # Answers 503 until a layout is assigned, so this also waits for init.
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 10

  # A fresh Garage node has no layout, no keys and no bucket. This puts them
  # there, and exits. Runs on a plain `docker compose up -d`, and is safe to
  # re-run — each step checks first.
  #
  # It is a second container because it has to be: the garage image is a single
  # static binary with no shell (`/bin/sh` does not exist in it), so there is
  # nothing to run a setup script with, and no entrypoint that could sequence
  # the calls. Anything that needs storage ready should depend on this service
  # completing, the way garage-ui below does.
  #
  # `service_started` rather than `service_healthy`: garage's healthcheck stays
  # red until a layout exists, and assigning that layout is this container's
  # job. Waiting for healthy would deadlock, so it polls instead.
  garage-init:
    image: alpine/curl:latest
    depends_on:
      garage:
        condition: service_started
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./docker/garage-init.sh:/init.sh:ro
    entrypoint: ['sh', '/init.sh']
    restart: on-failure

  # Not started by default: `docker compose --profile tools up -d garage-ui`.
  # Garage ships no web interface of its own — this is a community one, and
  # the only one of three tried that works against Garage v2's admin API.
  #
  # It holds the admin token, so it must never be reachable from outside the
  # box. Bound to localhost here; on Bangmod it belongs behind Caddy with its
  # own auth, or not exposed at all.
  garage-ui:
    image: noooste/garage-ui:latest
    profiles: ['tools']
    restart: unless-stopped
    depends_on:
      garage-init:
        condition: service_completed_successfully
    environment:
      GARAGE_UI_GARAGE_ENDPOINT: http://garage:3900
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: http://garage:3903
      GARAGE_UI_GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_UI_GARAGE_REGION: ${S3_REGION:-us-east-1}
      # Without `ENABLED` the username and password are read and ignored, and
      # the UI comes up with no login at all — verified.
      GARAGE_UI_AUTH_ADMIN_ENABLED: 'true'
      GARAGE_UI_AUTH_ADMIN_USERNAME: ${GARAGE_UI_USERNAME:-admin}
      GARAGE_UI_AUTH_ADMIN_PASSWORD: ${GARAGE_UI_PASSWORD}
    ports:
      - '127.0.0.1:${GARAGE_UI_PORT:-4909}:8080'

volumes:
  postgres-data:
  garage-meta:
  garage-data:
