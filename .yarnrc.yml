nodeLinker: node-modules
enableGlobalCache: true

# sharp ships one prebuilt binary per platform as an optional dependency, so a
# lockfile written on a Mac carries only the darwin one and `yarn install
# --immutable` inside the linux image fails to find its own. Naming every
# platform the project builds for puts all of them in yarn.lock: darwin for
# development, linux for the images, and musl because they are Alpine.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64
  libc:
    - glibc
    - musl
