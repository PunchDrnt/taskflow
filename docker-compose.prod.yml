# The deployable stack. Everything reaches the outside world through Caddy;
# no other service publishes a port.
#
#     docker compose -f docker-compose.prod.yml up -d --build
#
# Deliberately a separate file rather than an override on docker-compose.yml.
# Compose can add a service but cannot remove one, and the development file
# carries two that must never run here — postgres-test, which truncates
# tables, and garage-ui, which holds the admin token. The services these two
# files share are configured differently anyway: nothing below publishes a
# port, and Postgres runs the application as a role it creates rather than as
# the superuser.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # The superuser. The application does not use it — postgres-init.sh
      # creates APP_DB_USER, and DATABASE_URL names that one.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs once, on an empty data directory. Changing it later does nothing
      # until the volume is gone.
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      # Separate from the database's, and from each other. A database backup
      # cannot restore a file, so the two are backed up and restored apart.
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 10

  garage-init:
    image: alpine/curl:latest
    depends_on:
      garage:
        condition: service_started
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_ZONE: ${GARAGE_ZONE:-dc1}
      GARAGE_CAPACITY: ${GARAGE_CAPACITY:-10000000000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./docker/garage-init.sh:/init.sh:ro
    entrypoint: ['sh', '/init.sh']
    restart: on-failure

  # Migrations as their own one-shot container, for the reason `migrationsRun`
  # is false in data-source.options.ts: two API replicas starting together
  # would race on the DDL. This runs to completion before either starts.
  #
  # It needs DATABASE_URL and nothing else — see data-source.ts.
  api-migrate:
    build:
      context: .
      dockerfile: apps/api/core/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command:
      [
        'node',
        '../../../node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'dist/database/data-source.js',
      ]
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: apps/api/core/Dockerfile
    restart: unless-stopped
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      # Inside the network, so Garage's own ports rather than the 4xxx the
      # development file publishes.
      S3_ENDPOINT: garage
      S3_PORT: 3900
      S3_USE_SSL: 'false'
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/live').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/client/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, web]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      # Overridable so the whole stack can be smoke-tested on a machine that
      # already uses 80. On the server, leave them alone: ACME needs 80.
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account key. Losing this volume means
      # re-issuing every certificate, and Let's Encrypt rate-limits that.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  caddy-data:
  caddy-config:
