# Ships. Merging main into prod is the release, and ci.yml has already run the
# gates on main, so this only builds, pushes and restarts.
name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/taskflow

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          # paths-filter compares against the previous commit on this branch,
          # which needs more than the default shallow clone.
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/core/**'
              - 'packages/shared/**'
              - 'packages/config/**'
              - 'package.json'
              - 'yarn.lock'
            web:
              - 'apps/web/client/**'
              - 'packages/ui/**'
              - 'packages/config/**'
              - 'package.json'
              - 'yarn.lock'

  build:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/core/Dockerfile
          - app: web
            dockerfile: apps/web/client/Dockerfile
    steps:
      - uses: actions/checkout@v5

      # Skipping the whole step rather than setting a SKIP variable every later
      # step has to remember to check. A forgotten check there runs work that
      # was meant to be skipped, silently.
      - uses: docker/login-action@v3
        if: needs.changes.outputs[matrix.app] == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: needs.changes.outputs[matrix.app] == 'true'

      - name: Build and push ${{ matrix.app }}
        if: needs.changes.outputs[matrix.app] == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # The SHA tag is the rollback: `latest` alone leaves nothing to go
          # back to once the next push overwrites it.
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: [changes, build]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Restart the stack on Bangmod
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: GITHUB_SHA
          script: |
            set -eu
            # DEPLOY_PATH is a clone of this repository, not the deploy
            # directory inside it.
            cd ${{ secrets.DEPLOY_PATH }}
            export IMAGE_TAG="$GITHUB_SHA"

            # Images are only half of a deploy: compose.yml and everything
            # under deploy/config are read from disk, so without this a change
            # to the Caddyfile ships a green workflow and an unchanged server.
            # --force discards local edits to tracked files; deploy/.env is
            # untracked and survives.
            git fetch --depth 1 origin prod
            git checkout --force FETCH_HEAD

            cd deploy
            # No flags: compose.yml and .env sit in this directory.
            docker compose pull
            # `up -d` recreates api-migrate too, so migrations run against the
            # new image before the API that needs them starts.
            docker compose up -d --remove-orphans
            docker compose ps
            # Untagged layers only. The previous release keeps its SHA tag, so
            # rolling back is IMAGE_TAG=<old sha> and pulling.
            docker image prune -f
