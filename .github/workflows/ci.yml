# The gate. Runs on pull requests and ships nothing. deploy.yml is the other
# half: it fires only on prod and runs no tests, trusting what this proved.
name: CI

on:
  pull_request:
  workflow_dispatch:
  # Off for main while Phase 0 lands there directly and every push would be a
  # run nobody reads. Put this back once work arrives through pull requests —
  # until then main is only as green as the last local `yarn test`.
  # push:
  #   branches: [main]

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · types · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: corepack enable

      - run: yarn install --immutable

      # Also a check on .env.example itself: the suite reads the root .env
      # (see vitest.config.mts), so a variable missing from the example makes
      # CI fail rather than silently skipping a suite here and working on the
      # machine of whoever added it.
      - name: Use the committed example as the environment
        run: cp .env.example .env

      # DATABASE_URL_TEST and S3_HOST decide whether the integration
      # suites run or skip, and skipping must not be possible here — the
      # cross-org isolation test is 🔒 mandatory. See test/README.md.
      - name: Start Postgres and Garage
        run: docker compose up -d postgres-test garage garage-init

      # garage-init is deliberately absent: --wait exits 1 when a service in
      # its set stops, even successfully. Garage only reports healthy once the
      # layout exists, so this still fails if init never got that far.
      - name: Wait for them
        run: docker compose up -d --wait --wait-timeout 120 postgres-test garage

      - run: yarn lint
      - run: yarn check-types
      - run: yarn build
      - run: yarn test

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 100

  # deploy/ never runs in CI and never gets compiled, so nothing else here
  # would notice a Caddyfile that cannot parse until Caddy refuses to start on
  # the server — after the deploy has already replaced the working one.
  deploy-files:
    name: validate deploy/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: compose.yml resolves
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yml config --quiet

      # Catches syntax errors, unknown directives and malformed matchers. It
      # does not check intent: `reverse_proxy` with no upstream is valid.
      - name: Caddyfile adapts
        run: |
          docker run --rm -e SITE_ADDRESS=":80" \
            -v "$PWD/deploy/config/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: shell scripts parse
        run: for f in deploy/*.sh deploy/init/*.sh; do sh -n "$f"; done

      # The server runs this to prove its files match the deploy. If it is
      # broken, every deploy fails at the gate instead.
      - name: checksum.sh runs
        run: cd deploy && ./checksum.sh

  images:
    name: docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Overlaps deploy.yml's build job on purpose: that one runs only once the
    # change is already on prod, which is too late to learn the Dockerfile is
    # broken. Same gha cache scope, so the second build is mostly cached.
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/core/Dockerfile
          - app: web
            dockerfile: apps/web/client/Dockerfile

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
