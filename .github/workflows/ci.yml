name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · types · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: corepack enable

      - run: yarn install --immutable

      # Also a check on .env.example itself: the suite reads the root .env
      # (see vitest.config.mts), so a variable missing from the example makes
      # CI fail rather than silently skipping a suite here and working on the
      # machine of whoever added it.
      - name: Use the committed example as the environment
        run: cp .env.example .env

      # DATABASE_URL_TEST and S3_ENDPOINT decide whether the integration
      # suites run or skip, and skipping must not be possible here — the
      # cross-org isolation test is 🔒 mandatory. See test/README.md.
      - name: Start Postgres and Garage
        run: docker compose up -d postgres-test garage garage-init

      # garage-init is deliberately absent: --wait exits 1 when a service in
      # its set stops, even successfully. Garage only reports healthy once the
      # layout exists, so this still fails if init never got that far.
      - name: Wait for them
        run: docker compose up -d --wait --wait-timeout 120 postgres-test garage

      - run: yarn lint
      - run: yarn check-types
      - run: yarn build
      - run: yarn test

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 100

  images:
    name: docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Both images build from the repository root and compile the workspace,
    # so a broken Dockerfile is caught here rather than during a deploy.
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/core/Dockerfile
          - app: web
            dockerfile: apps/web/client/Dockerfile

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
