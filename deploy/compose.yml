# The deployable stack. Everything reaches the outside world through Caddy;
# no other service publishes a port.
#
#     cd deploy && cp .env.example .env    # then fill it in
#     docker compose pull && docker compose up -d
#
# No flags: `compose.yml` and a sibling `.env` are what docker compose picks up
# on its own. Everything this mounts sits beside it, so deploy/ plus that .env
# is what a server needs and nothing else from the repository.
#
#   config/  mounted read-only, and re-read on the next `up -d`
#   init/    run once against an empty volume, and ignored ever after
#
# Both `image:` and `build:` are set on the three app services. The server
# pulls what CI already built and tested; `up -d --build` still works on a
# machine with the source, which is how the stack is smoke-tested locally.
# IMAGE_TAG is what makes a rollback possible: CI tags every image with the
# commit SHA as well as latest, so going back is setting it and pulling.
#
# A separate file from the repository root's, not an override: Compose can add
# a service but never remove one, and the development file carries two that
# must not run here — postgres-test truncates tables, garage-ui holds the
# admin token.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # The superuser. The application connects as APP_DB_USER instead,
      # which init/postgres.sh creates.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs once, on an empty data directory.
      - ./init/postgres.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      # Separate from the database's: a database backup cannot restore a file.
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 10

  garage-init:
    image: alpine/curl:latest
    depends_on:
      garage:
        condition: service_started
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_ZONE: ${GARAGE_ZONE:-dc1}
      GARAGE_CAPACITY: ${GARAGE_CAPACITY:-10000000000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./init/garage.sh:/init.sh:ro
    entrypoint: ['sh', '/init.sh']
    restart: on-failure

  # One-shot, for the reason `migrationsRun` is false: two API replicas
  # starting together would race on the DDL. Needs DATABASE_URL and nothing
  # else — see data-source.ts.
  api-migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/punchdrnt/taskflow}-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/api/core/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # One entrypoint: migrations, then the required seed. Compose's command is
    # an exec array with no shell, and the ordering belongs in code anyway.
    command: ['node', 'dist/database/migrate.js']
    restart: on-failure

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/punchdrnt/taskflow}-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/api/core/Dockerfile
    restart: unless-stopped
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      # Inside the network: Garage's own port, not the 4xxx dev publishes.
      S3_HOST: garage
      S3_PORT: 3900
      S3_USE_SSL: 'false'
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4001/health/live').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/punchdrnt/taskflow}-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/client/Dockerfile
      # Build arguments, not environment: NEXT_PUBLIC_* is baked into the
      # browser bundle when it is compiled. Changing either one needs --build.
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # The server half reads these at runtime, unlike the two above.
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, web]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      # Overridable so the whole stack can be smoke-tested on a machine that
      # already uses 80. On the server, leave them alone: ACME needs 80.
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account key. Losing it means re-issuing
      # every certificate, which Let's Encrypt rate-limits.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  caddy-data:
  caddy-config:
